<title>Deck Diffs</title>

<meta property="og:title" content="Deck Diffs">
<meta property="og:description" content="Mostre o que saiu e o que entrou no seu deck de Magic, carta por carta. / Show what went out and what came in, card by card.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: no computador, coluna lateral fixa com as listas e área principal com a grade de trocas; no celular, tudo empilhado. */
:root {
  --bg: #eef0f3;
  --surface: #ffffff;
  --sunken: #e3e6eb;
  --ink: #1b1f27;
  --muted: #5d6574;
  --line: #d6dae1;
  --accent: #946512;
  --accent-ink: #ffffff;
  --out: #b3402f;
  --in: #2c7a48;
  --font-display: "Familjen Grotesk", "Segoe UI", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  --pair-min: 460px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12151b; --surface: #1a1e26; --sunken: #151820; --ink: #e7e9ee; --muted: #9aa2b1; --line: #2c323d;
    --accent: #d9a441; --accent-ink: #1a1405; --out: #e0715f; --in: #5cbf82; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12151b; --surface: #1a1e26; --sunken: #151820; --ink: #e7e9ee; --muted: #9aa2b1; --line: #2c323d;
  --accent: #d9a441; --accent-ink: #1a1405; --out: #e0715f; --in: #5cbf82; color-scheme: dark;
}
* { box-sizing: border-box; }
html { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--font-body); }
h1, h2 { font-family: var(--font-display); text-wrap: balance; margin: 0; line-height: 1.1; }
h1 { font-size: clamp(1.7rem, 3vw, 2.2rem); font-weight: 700; letter-spacing: -0.01em; }
h2 { font-size: 1.2rem; font-weight: 700; }
code, kbd { font-family: var(--font-mono); font-size: 0.92em; }
.label { font: 600 0.72rem/1 var(--font-body); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.out-ink { color: var(--out); }
.in-ink { color: var(--in); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app {
  max-width: 1680px; margin: 0 auto; padding-inline: 16px; padding-block: 20px 64px;
  display: grid; gap: 24px;
}
@media (min-width: 1100px) {
  .app { grid-template-columns: 370px minmax(0, 1fr); align-items: start; padding-inline: 28px; gap: 32px; }
  .topbar { grid-column: 1 / -1; }
  .side { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 16px); }
}

/* Topo */
.topbar { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: end; gap: 12px 24px; }
.topbar p { color: var(--muted); margin: 6px 0 0; max-width: 60ch; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; border-radius: 0; padding: 8px 12px; background: transparent; color: var(--muted); font-weight: 600; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }

/* Coluna lateral */
.side { display: grid; gap: 16px; min-width: 0; }
.field { display: grid; gap: 7px; min-width: 0; }
input[type="text"], textarea {
  width: 100%; color: var(--ink); background: var(--surface);
  border: 1px solid var(--line); border-radius: 7px;
}
input[type="text"] { padding: 10px 12px; font: 15px/1.4 var(--font-body); }
textarea { min-height: 240px; resize: vertical; padding: 12px; font: 13.5px/1.65 var(--font-mono); }
.hint { color: var(--muted); font-size: 0.84rem; margin: 0; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
button {
  font: 600 0.88rem/1 var(--font-body); padding: 10px 14px; border-radius: 7px; cursor: pointer;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink);
}
button:hover { border-color: var(--muted); }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
button:disabled { opacity: 0.6; cursor: progress; }
.status { color: var(--muted); font-size: 0.86rem; min-height: 1.3em; margin: 0; }
.status.error { color: var(--out); }

/* Área principal */
.main { display: grid; gap: 20px; min-width: 0; }
.toolbar {
  display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 14px 24px;
  padding-bottom: 14px; border-bottom: 1px solid var(--line);
}
.stats { display: flex; flex-wrap: wrap; gap: 8px 26px; }
.stat { display: grid; gap: 4px; }
.stat .val { font: 500 1.3rem/1 var(--font-mono); font-variant-numeric: tabular-nums; }
.tools { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; }
.sortbox { display: inline-flex; gap: 8px; align-items: center; }
select {
  font: 500 0.88rem/1.2 var(--font-body); color: var(--ink); background: var(--surface);
  border: 1px solid var(--line); border-radius: 7px; padding: 8px 10px; max-width: 100%;
}
.check { display: inline-flex; gap: 6px; align-items: center; font-size: 0.85rem; cursor: pointer; color: var(--muted); }
.empty { color: var(--muted); padding: 40px 0; text-align: center; }

/* Grade de trocas */
.swaps { display: grid; gap: 18px; grid-template-columns: repeat(auto-fill, minmax(min(var(--pair-min), 100%), 1fr)); }
.swap {
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px;
  display: grid; column-gap: 14px; row-gap: 12px; align-items: start; justify-content: center;
  grid-template-columns: minmax(0, 488px) 30px minmax(0, 488px);
  grid-template-areas: "co nm ci" "ao ar ai" "io . ii";
}
.num { grid-area: nm; justify-self: center; font: 500 0.78rem/1.4 var(--font-mono); color: var(--muted); }
.chip { font: 600 0.68rem/1 var(--font-body); letter-spacing: 0.08em; text-transform: uppercase; padding: 4px 7px; border-radius: 3px; border: 1px solid currentColor; justify-self: start; }
.chip.out { grid-area: co; color: var(--out); }
.chip.in { grid-area: ci; color: var(--in); }
.arrow { grid-area: ar; align-self: center; justify-self: center; color: var(--accent); }
.arrow svg { display: block; width: 26px; height: 26px; }
.art {
  width: 100%; max-width: 100%; aspect-ratio: 488 / 680; border-radius: 4.75% / 3.5%;
  background: var(--sunken); overflow: hidden; display: grid; place-items: center;
}
.art.out { grid-area: ao; box-shadow: 0 0 0 3px var(--surface), 0 0 0 6px var(--out); }
.art.in { grid-area: ai; box-shadow: 0 0 0 3px var(--surface), 0 0 0 6px var(--in); }
.art img { width: 100%; height: 100%; object-fit: cover; display: block; }
.art .missing, .art.slot { padding: 12px; text-align: center; color: var(--muted); font-size: 0.85rem; }
.art.slot { box-shadow: none; background: transparent; border: 2px dashed var(--line); }
.info { display: grid; gap: 6px; min-width: 0; }
.info.out { grid-area: io; }
.info.in { grid-area: ii; }
.name { font-weight: 600; line-height: 1.3; overflow-wrap: anywhere; }
.info.out .name { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--out); font-weight: 500; }
.meta { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 0.84rem; align-items: center; }
.price { font: 500 0.92rem/1 var(--font-mono); font-variant-numeric: tabular-nums; color: var(--accent); }
.meta a { color: var(--accent); text-decoration: none; font-weight: 500; }
.meta a:hover { text-decoration: underline; }
.swap.owned .price { text-decoration: line-through; color: var(--muted); }
@media (max-width: 520px) {
  .swap { padding: 12px; column-gap: 9px; grid-template-columns: minmax(0, 1fr) 22px minmax(0, 1fr); }
  .arrow svg { width: 20px; height: 20px; }
  .art.out { box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--out); }
  .art.in { box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--in); }
}

/* Lista de compras */
.buy { display: grid; gap: 10px; max-width: 760px; }
.buy pre {
  margin: 0; padding: 12px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 7px;
  font: 13.5px/1.6 var(--font-mono); white-space: pre-wrap; overflow-x: auto;
}
footer { color: var(--muted); font-size: 0.8rem; grid-column: 1 / -1; max-width: 90ch; }
footer a { color: inherit; }
@media (prefers-reduced-motion: no-preference) {
  .art img { transition: opacity 0.2s; }
}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div>
      <h1 data-i18n="title">Deck Diffs</h1>
      <p data-i18n="lede">Uma troca por linha: a carta que saiu, uma seta, e a carta que entrou no lugar dela.</p>
    </div>
    <div class="seg" role="group" aria-label="Idioma / Language">
      <button type="button" data-lang="pt" aria-pressed="true">PT-BR</button>
      <button type="button" data-lang="en" aria-pressed="false">EN</button>
    </div>
  </header>

  <aside class="side">
    <div class="field">
      <label class="label" for="deckName" data-i18n="deckLabel">Nome do deck</label>
      <input type="text" id="deckName" autocomplete="off" data-i18n-ph="deckPh">
    </div>
    <div class="field">
      <label class="label" for="swapList"><span class="out-ink" data-i18n="outWord">Saiu</span> --&gt; <span class="in-ink" data-i18n="inWord">Entrou</span></label>
      <textarea id="swapList" spellcheck="false"></textarea>
    </div>
    <div class="actions">
      <button class="primary" id="go" data-i18n="go">Mostrar trocas</button>
      <button id="share" data-i18n="share">Copiar link</button>
    </div>
    <p class="status" id="status" role="status"></p>
    <p class="hint" data-i18n-html="hint"></p>
  </aside>

  <main class="main">
    <div class="empty" id="empty" data-i18n="emptyState">As trocas aparecem aqui.</div>
    <section id="results" hidden>
      <div class="toolbar">
        <div class="stats" id="stats"></div>
        <div class="tools">
          <label class="sortbox">
            <span class="label" data-i18n="sortLabel">Ordenar</span>
            <select id="sortBy">
              <option value="list" data-i18n="sortList">Ordem da lista</option>
              <option value="priceDesc" data-i18n="sortPriceDesc">Preço: maior primeiro</option>
              <option value="priceAsc" data-i18n="sortPriceAsc">Preço: menor primeiro</option>
              <option value="toBuy" data-i18n="sortToBuy">A comprar primeiro</option>
              <option value="name" data-i18n="sortName">Nome (A–Z)</option>
              <option value="cmc" data-i18n="sortCmc">Custo de mana</option>
              <option value="color" data-i18n="sortColor">Cor (WUBRG)</option>
              <option value="type" data-i18n="sortType">Tipo de carta</option>
            </select>
          </label>
          <div class="seg" role="group" data-i18n-aria="sizeLabel" aria-label="Tamanho das cartas">
            <button type="button" data-size="s" aria-pressed="false" data-i18n="sizeS">P</button>
            <button type="button" data-size="m" aria-pressed="true">M</button>
            <button type="button" data-size="l" aria-pressed="false" data-i18n="sizeL">G</button>
          </div>
          <div class="actions">
            <button class="primary" id="downloadPdf" data-i18n="pdf">Baixar PDF</button>
            <button id="downloadImg" data-i18n="img">Baixar imagem</button>
            <button id="copyImg" data-i18n="copyImg">Copiar imagem</button>
          </div>
          <label class="check"><input type="checkbox" id="pdfLight"> <span data-i18n="pdfLight">PDF com fundo claro</span></label>
        </div>
      </div>
      <div class="swaps" id="swaps" style="margin-top: 20px"></div>
    </section>

    <section class="buy" id="buy" hidden>
      <h2 data-i18n="buyTitle">Lista de compras</h2>
      <p class="hint" data-i18n="buyHint"></p>
      <pre id="buyText"></pre>
      <div class="actions"><button id="copyBuy" data-i18n="copyBuy">Copiar lista</button></div>
    </section>
  </main>

  <footer data-i18n-html="footer"></footer>
</div>

const LANG_KEY = "deck-diffs-lang", SIZE_KEY = "deck-diffs-size", OWNED_KEY = "deck-diffs-owned", SORT_KEY = "deck-diffs-sort";
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : v; } catch (_) { return d; } },

};
let lang = store.get(LANG_KEY, (navigator.language || "pt").toLowerCase().startsWith("pt") ? "pt" : "en");
if (!I18N[lang]) lang = "pt";
const t = (k, ...a) => { const v = I18N[lang][k]; return typeof v === "function" ? v(...a) : v; };

const EXAMPLE = [
  "Mind Stone --> Fellwar Stone",
  "Commander's Sphere --> Talisman of Dominance",
  "Cancel --> Counterspell",
  "Path of Ancestry --> Command Tower (CMR) 350",
].join("\n");
const ARROW = /\s*(?:-+>|=+>|[→➜➔⇒])\s*/;

const $ = (id) => document.getElementById(id);
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const norm = (s) => s.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().trim();

/* ---------- Leitura das linhas ---------- */
function parseLine(raw) {
  let s = raw.trim();
  if (!s || s.startsWith("//") || s.startsWith("#")) return null;
  if (/^(sideboard|commander|commanders|deck|mainboard|maybeboard|companion|about)\s*(\(\d+\))?\s*:?$/i.test(s)) return null;
  let qty = 1;
  let m = s.match(/^(\d+)\s*x?\s+(.+)$/i);
  if (m) { qty = parseInt(m[1], 10); s = m[2]; }
  s = s.replace(/\s#.*$/, "")            // tags do Moxfield (#Ramp)
       .replace(/\s*\[[^\]]*\]/g, "")    // categorias do Archidekt [Ramp]
       .replace(/\s*\*[A-Za-z]+\*/g, "") // *F* *E*
       .trim();
  let set = null, cn = null;
  m = s.match(/^(.+?)\s+\(([A-Za-z0-9]{2,6})\)(?:\s+([A-Za-z0-9★\-]+))?$/);
  if (m) { s = m[1].trim(); set = m[2].toLowerCase(); cn = m[3] || null; }
  if (!s) return null;
  return { qty, name: s, set, cn };
}
function parseSwaps(text) {
  const pairs = [], bad = [];
  text.split(/\r?\n/).forEach((raw, i) => {
    const line = raw.trim();
    if (!line || line.startsWith("//")) return;
    const parts = line.split(ARROW);
    if (parts.length !== 2) { bad.push(i + 1); return; }
    const out = parseLine(parts[0]), inn = parseLine(parts[1]);
    if (!out && !inn) { bad.push(i + 1); return; }
    pairs.push({ out, in: inn });
  });
  return { pairs, bad };
}
const keyOf = (e) => [norm(e.name), e.set || "", e.cn || ""].join("|");

/* ---------- Scryfall ---------- */
function indexCards(cards) {
  const byName = new Map(), byPrint = new Map();
  for (const c of cards) {
    [c.name, ...(c.card_faces || []).map((f) => f.name)].forEach((n) => { if (n && !byName.has(norm(n))) byName.set(norm(n), c); });
    byPrint.set(`${c.set}|${String(c.collector_number).toLowerCase()}`, c);
  }
  return { byName, byPrint };
}
async function postCollection(identifiers) {
  const res = await fetch("https://api.scryfall.com/cards/collection", {
    method: "POST",
    headers: { "Content-Type": "application/json", "Accept": "application/json" },
    body: JSON.stringify({ identifiers }),
  });
  if (!res.ok) throw new Error(t("scryStatus", res.status));
  return res.json();
}
// Scryfall pede no máximo ~10 requisições por segundo: cada chamada reserva um horário
let nextSlot = 0;
async function throttle() {
  const now = Date.now();
  const at = Math.max(now, nextSlot);
  nextSlot = at + 110;
  if (at > now) await sleep(at - now);
}
async function pool(list, size, fn) {
  let i = 0;
  const worker = async () => { while (i < list.length) { const item = list[i++]; await fn(item); } };
  await Promise.all(Array.from({ length: Math.min(size, list.length) }, worker));
}
const cheapCache = new Map(); // oracle_id/nome -> impressão mais barata (vale enquanto a página estiver aberta)
const usdOf = (c) => (c?.prices?.usd ? parseFloat(c.prices.usd) : null);
async function cheapestPrint(card) {
  const id = card.oracle_id || card.card_faces?.[0]?.oracle_id;
  const cacheKey = id || norm(card.name);
  if (cheapCache.has(cacheKey)) return cheapCache.get(cacheKey);
  // só impressões jogáveis: fora borda dourada (World Championship), Collectors' Edition e cartas gigantes
  const q = (id ? `oracleid:${id}` : `!"${card.name.split(" // ")[0]}"`) + " usd>0 game:paper -set_type:memorabilia -border:gold -is:oversized";
  let best = null;
  try {
    await throttle();
    const r = await fetch(`https://api.scryfall.com/cards/search?q=${encodeURIComponent(q)}&unique=prints&order=usd&dir=asc`, { headers: { Accept: "application/json" } });
    if (r.ok) {
      const j = await r.json();
      for (const c of j.data || []) { if (usdOf(c) != null && (!best || usdOf(c) < usdOf(best))) best = c; }
    }
  } catch (_) { /* mantém a impressão encontrada */ }
  if (best) cheapCache.set(cacheKey, best);
  return best;
}

async function lookup(entries, cheapKeys = new Set(), onProgress) {
  const uniq = new Map();
  entries.forEach((e) => { const k = keyOf(e); if (!uniq.has(k)) uniq.set(k, e); });
  const found = new Map();
  const items = [...uniq.entries()];

  // 1) Em lote pelo /cards/collection (até 75 por chamada)
  for (let i = 0; i < items.length; i += 75) {
    const chunk = items.slice(i, i + 75);
    const ids = chunk.map(([, e]) =>
      e.set && e.cn ? { set: e.set, collector_number: e.cn } : e.set ? { name: e.name, set: e.set } : { name: e.name });
    const json = await postCollection(ids);
    const idx = indexCards(json.data || []);
    chunk.forEach(([k, e]) => {
      // coleção + número só valem se a carta encontrada tiver o nome digitado
      const byNum = e.set && e.cn ? idx.byPrint.get(`${e.set}|${e.cn.toLowerCase()}`) : null;
      const sameName = byNum && [byNum.name, ...(byNum.card_faces || []).map((f) => f.name)].some((n) => norm(n) === norm(e.name));
      const c = (sameName && byNum) || idx.byName.get(norm(e.name));
      if (c) found.set(k, c);
    });
    if (i + 75 < items.length) await sleep(120);
  }
  // 2) O que faltou: só pelo nome, depois busca aproximada (erro de digitação, acento)
  const missing = items.filter(([k]) => !found.has(k));
  if (missing.length) {
    const json = await postCollection(missing.slice(0, 75).map(([, e]) => ({ name: e.name })));
    const idx = indexCards(json.data || []);
    missing.forEach(([k, e]) => { const c = idx.byName.get(norm(e.name)); if (c) found.set(k, c); });
  }
  for (const [k, e] of items.filter(([k]) => !found.has(k)).slice(0, 20)) {
    await sleep(110);
    try {
      const r = await fetch(`https://api.scryfall.com/cards/named?fuzzy=${encodeURIComponent(e.name)}`, { headers: { Accept: "application/json" } });
      if (r.ok) found.set(k, await r.json());
    } catch (_) { /* segue sem a carta */ }
  }
  // 3) Cartas que entram: sempre a edição mais barata com preço, mesmo que a linha traga coleção
  const cheapTargets = items.filter(([k]) => cheapKeys.has(k) && found.has(k));
  let done = 0;
  await pool(cheapTargets, 4, async ([k]) => {
    const best = await cheapestPrint(found.get(k));
    if (best) found.set(k, best);
    onProgress && onProgress(++done, cheapTargets.length);
  });
  return found;
}

/* ---------- Dados das cartas ---------- */
const imgOf = (c) => c && (c.image_uris?.normal || c.card_faces?.[0]?.image_uris?.normal);
const largeOf = (c) => c && (c.image_uris?.large || c.card_faces?.[0]?.image_uris?.large || imgOf(c));
function priceOf(c) {
  if (!c || !c.prices) return null;
  const p = c.prices.usd || c.prices.usd_foil || c.prices.usd_etched;
  return p ? parseFloat(p) : null;
}
const usd = (n) => (lang === "pt" ? "US$ " + n.toFixed(2).replace(".", ",") : "$" + n.toFixed(2));
// PT: Liga Magic. EN: link de compra que o próprio Scryfall fornece (TCGplayer).
function buyUrl(c, name) {

  return c?.purchase_uris?.tcgplayer || null;
}
let current = { pairs: [], found: new Map() };
const nameOf = (e) => { const c = current.found.get(keyOf(e)); return c ? c.name : e.name; };

let owned = (() => { try { return new Set(JSON.parse(store.get(OWNED_KEY, "[]"))); } catch (_) { return new Set(); } })();

const isOwned = (e) => owned.has(norm(nameOf(e)));

function buyInfo() {
  let total = 0;
  const list = [];
  current.pairs.forEach(({ in: e }) => {
    if (!e || isOwned(e)) return;
    list.push(`${e.qty} ${nameOf(e)}`);
    const p = priceOf(current.found.get(keyOf(e)));

}

/* ---------- Ordenação ---------- */
// Ordena pela carta que entra; numa troca em que nada entrou, usa a que saiu.
const SORTS = ["list", "priceDesc", "priceAsc", "toBuy", "name", "cmc", "color", "type"];
let sortBy = store.get(SORT_KEY, "list");
if (!SORTS.includes(sortBy)) sortBy = "list";
const COLOR_ORDER = { W: 0, U: 1, B: 2, R: 3, G: 4 };
const TYPE_ORDER = ["Creature", "Planeswalker", "Battle", "Instant", "Sorcery", "Artifact", "Enchantment", "Land"];
const cardFor = (p) => { const e = p.in || p.out; return e ? current.found.get(keyOf(e)) : null; };
function inPrice(p) {
  if (!p.in) return null;
  const pr = priceOf(current.found.get(keyOf(p.in)));
  return pr == null ? null : pr * p.in.qty;
}
function colorRank(c) {
  if (!c) return 99;
  const cols = c.colors || c.card_faces?.[0]?.colors || [];
  if (!cols.length) return 7;                 // incolor (artefatos, terrenos)
  if (cols.length > 1) return 5 + cols.length / 10; // multicolor
  return COLOR_ORDER[cols[0]] ?? 6;
}
function typeRank(c) {
  if (!c) return 99;
  const tl = (c.type_line || "").split("//")[0];
  const i = TYPE_ORDER.findIndex((x) => tl.includes(x));
  return i < 0 ? TYPE_ORDER.length : i;
}
const buyRank = (p) => (p.in ? (isOwned(p.in) ? 1 : 0) : 2);
// valores ausentes (sem preço, carta não encontrada) sempre vão para o fim
const byNum = (a, b, dir) => (a == null && b == null ? 0 : a == null ? 1 : b == null ? -1 : dir * (a - b));
function viewPairs() {
  const v = current.pairs.map((p, idx) => ({ p, idx }));
  const cmp = {
    list: () => 0,
    priceDesc: (x, y) => byNum(inPrice(x.p), inPrice(y.p), -1),
    priceAsc: (x, y) => byNum(inPrice(x.p), inPrice(y.p), 1),
    toBuy: (x, y) => buyRank(x.p) - buyRank(y.p),
    name: (x, y) => nameOf(x.p.in || x.p.out).localeCompare(nameOf(y.p.in || y.p.out), t("locale")),
    cmc: (x, y) => byNum(cardFor(x.p)?.cmc, cardFor(y.p)?.cmc, 1),
    color: (x, y) => colorRank(cardFor(x.p)) - colorRank(cardFor(y.p)),
    type: (x, y) => typeRank(cardFor(x.p)) - typeRank(cardFor(y.p)),
  }[sortBy];
  return v.sort((x, y) => cmp(x, y) || x.idx - y.idx);
}
function setSort(v) {

  store.set(SORT_KEY, sortBy);

}

/* ---------- Tela ---------- */
const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; };
const ARROW_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12h15M13 6l6 6-6 6"/></svg>';

function artEl(entry, side) {
  if (!entry) return el("div", `art ${side} slot`, side === "out" ? t("onlyIn") : t("onlyOut"));
  const c = current.found.get(keyOf(entry));
  const art = el("div", `art ${side}`);
  const src = imgOf(c);
  if (src) {
    const img = el("img");
    img.crossOrigin = "anonymous"; img.src = src; img.alt = nameOf(entry); img.loading = "lazy";
    art.appendChild(img);

    art.appendChild(el("div", "missing", t("notFound", entry.name)));

}

function infoEl(entry, side, swap) {
  const info = el("div", `info ${side}`);
  if (!entry) return info;
  const c = current.found.get(keyOf(entry));
  const name = nameOf(entry);
  info.appendChild(el("div", "name", (entry.qty > 1 ? entry.qty + "× " : "") + name));
  if (side === "in") {
    const meta = el("div", "meta");
    const p = priceOf(c);
    meta.appendChild(el("span", "price", p != null ? usd(p * entry.qty) : t("noPrice")));
    const url = buyUrl(c, name);
    if (url) { const a = el("a", null, t("buyLink")); a.href = url; a.target = "_blank"; a.rel = "noopener"; meta.appendChild(a); }
    if (c?.scryfall_uri) { const a = el("a", null, "Scryfall"); a.href = c.scryfall_uri; a.target = "_blank"; a.rel = "noopener"; meta.appendChild(a); }
    const lab = el("label", "check");
    const cb = el("input");
    cb.type = "checkbox";
    cb.dataset.owned = norm(name);
    cb.checked = owned.has(norm(name));
    swap.classList.toggle("owned", cb.checked);
    cb.addEventListener("change", () => {
      cb.checked ? owned.add(norm(name)) : owned.delete(norm(name));
      saveOwned();
      // a mesma carta pode aparecer em mais de uma troca
      document.querySelectorAll("input[data-owned]").forEach((x) => {
        if (x.dataset.owned !== norm(name)) return;
        x.checked = cb.checked; x.closest(".swap").classList.toggle("owned", cb.checked);
      });
      renderSummary();
    });
    lab.append(cb, document.createTextNode(t("owned")));
    info.append(meta, lab);
  }
  return info;
}

function swapEl(p, i) {
  const swap = el("article", "swap");
  const arrow = el("div", "arrow"); arrow.innerHTML = ARROW_SVG;
  swap.append(
    el("span", "chip out", t("chipOut")),
    el("span", "num", String(i + 1).padStart(2, "0")),
    el("span", "chip in", t("chipIn")),
    artEl(p.out, "out"), arrow, artEl(p.in, "in"),
    infoEl(p.out, "out", swap), infoEl(p.in, "in", swap),

  return swap;
}

function renderSummary() {
  const { pairs, found } = current;
  const { total, list } = buyInfo();
  const notFound = pairs.flatMap((p) => [p.out, p.in]).filter((e) => e && !found.has(keyOf(e))).length;
  const stats = [[t("statSwaps"), pairs.length], [t("statBuy"), list.length], [t("statTotal"), usd(total)]];
  if (notFound) stats.push([t("statMissing"), notFound]);
  $("stats").replaceChildren(...stats.map(([l, v]) => { const d = el("div", "stat"); d.append(el("span", "label", l), el("span", "val", v)); return d; }));
  $("buyText").textContent = list.length ? list.join("\n") : t("buyEmpty");

}

function render() {
  $("swaps").replaceChildren(...viewPairs().map(({ p, idx }) => swapEl(p, idx)));

const IMG = {

function wrapText(ctx, text, maxW, maxLines) {

  }
  if (cur) lines.push(cur);
  if (lines.length > maxLines) {
    lines.length = maxLines;
    let l = lines[maxLines - 1];
    while (l && ctx.measureText(l + "…").width > maxW) l = l.slice(0, -1);

function drawCard(ctx, x, y, entry, side, im) {

  ctx.fillStyle = color; ctx.textBaseline = "top";
  ctx.fillText(side === "out" ? t("pdfOut") : t("pdfIn"), x, y);

    ctx.fillText(side === "out" ? t("slotOut") : t("slotIn"), x + CARD_W / 2, cy + CARD_H / 2 - 10);

    ctx.textAlign = "left";

  let ty = cy + CARD_H + 20;
  ctx.font = `${side === "out" ? 500 : 600} 22px ${IMG.body}`;
  ctx.fillStyle = side === "out" ? IMG.muted : IMG.ink;
  wrapText(ctx, (entry.qty > 1 ? entry.qty + "× " : "") + name, CARD_W, 2).forEach((l, i) => {
    ctx.fillText(l, x, ty + i * 28);
    if (side === "out") {
      ctx.fillStyle = IMG.out; ctx.fillRect(x, ty + i * 28 + 13, ctx.measureText(l).width, 2); ctx.fillStyle = IMG.muted;
    }
  });
  if (side === "in") {
    ty += 2 * 28 + 6;
    const p = priceOf(current.found.get(keyOf(entry)));
    ctx.font = `500 20px ${IMG.mono}`;
    ctx.fillStyle = isOwned(entry) ? IMG.muted : IMG.accent;

}
function drawArrowImg(ctx, cx, cy) {
  ctx.strokeStyle = IMG.accent; ctx.lineWidth = 5; ctx.lineCap = "round"; ctx.lineJoin = "round";
  ctx.beginPath(); ctx.moveTo(cx - 20, cy); ctx.lineTo(cx + 18, cy);
  ctx.moveTo(cx + 4, cy - 14); ctx.lineTo(cx + 18, cy); ctx.lineTo(cx + 4, cy + 14); ctx.stroke();
}

async function buildImage() {
  const view = viewPairs();
  const pairs = view.map((v) => v.p);
  const n = pairs.length;
  const cols = n <= 1 ? 1 : n <= 4 ? 2 : 3;
  const rows = Math.ceil(n / cols);
  const W = MARGIN * 2 + cols * BLOCK_W + (cols - 1) * GAP;
  const H = HEAD_H + rows * BLOCK_H + (rows - 1) * GAP + FOOT_H + MARGIN;
  try {
    await Promise.all(['700 40px "Familjen Grotesk"', '600 20px "IBM Plex Sans"', '400 20px "IBM Plex Sans"', '500 20px "IBM Plex Mono"'].map((f) => document.fonts.load(f)));
  } catch (_) { /* usa a fonte reserva */ }
  const srcs = pairs.flatMap((p) => [p.out, p.in]).map((e) => e && imgOf(current.found.get(keyOf(e))));
  const imgs = await Promise.all(srcs.map(loadImg));

  const cv = document.createElement("canvas");
  cv.width = W; cv.height = H;
  const ctx = cv.getContext("2d");
  ctx.fillStyle = IMG.bg; ctx.fillRect(0, 0, W, H);
  ctx.textBaseline = "top";

  ctx.fillStyle = IMG.accent; ctx.font = `600 18px ${IMG.body}`; spaced(ctx, 3);
  ctx.fillText(t("headLabel"), MARGIN, MARGIN);
  spaced(ctx, 0);
  ctx.fillStyle = IMG.ink; ctx.font = `700 52px ${IMG.display}`;
  ctx.fillText(wrapText(ctx, deckTitle(), W - MARGIN * 2, 1)[0], MARGIN, MARGIN + 30);
  ctx.fillStyle = IMG.line; ctx.fillRect(MARGIN, HEAD_H - 22, W - MARGIN * 2, 2);

  pairs.forEach((p, i) => {
    const col = i % cols, row = Math.floor(i / cols);
    const bx = MARGIN + col * (BLOCK_W + GAP), by = HEAD_H + row * (BLOCK_H + GAP);
    ctx.fillStyle = IMG.panel; rr(ctx, bx, by, BLOCK_W, BLOCK_H, 18); ctx.fill();
    ctx.fillStyle = IMG.muted; ctx.font = `500 16px ${IMG.mono}`; ctx.textAlign = "center";
    ctx.fillText(String(view[i].idx + 1).padStart(2, "0"), bx + PAD + CARD_W + ARROW_W / 2, by + PAD);
    ctx.textAlign = "left";
    drawCard(ctx, bx + PAD, by + PAD, p.out, "out", imgs[i * 2]);
    drawArrowImg(ctx, bx + PAD + CARD_W + ARROW_W / 2, by + PAD + 36 + CARD_H / 2);
    drawCard(ctx, bx + PAD + CARD_W + ARROW_W, by + PAD, p.in, "in", imgs[i * 2 + 1]);
  });

  const { total, list } = buyInfo();
  const fy = H - MARGIN - 34;
  ctx.font = `500 24px ${IMG.mono}`; ctx.fillStyle = IMG.ink;
  ctx.fillText(t("footBuy", list.length, usd(total)), MARGIN, fy);
  ctx.font = `400 18px ${IMG.body}`; ctx.fillStyle = IMG.muted; ctx.textAlign = "right";
  ctx.fillText(t("credit", new Date().toLocaleDateString(t("locale"))), W - MARGIN, fy + 4);
  ctx.textAlign = "left";

  const missing = imgs.filter((im, k) => srcs[k] && !im).length;
  const blob = await new Promise((res, rej) => {
    try { cv.toBlob((b) => (b ? res(b) : rej(new Error("blob"))), "image/png"); } catch (e) { rej(e); }
  });
  return { blob, missing };
}

async function exportImage(mode, btn) {
  if (!current.pairs.length) return;
  const old = btn.textContent, status = $("status");
  btn.disabled = true; btn.textContent = t("generating");
  status.classList.remove("error"); status.textContent = "";
  try {
    let missing = 0;
    if (mode === "copy") {
      if (!navigator.clipboard || typeof ClipboardItem === "undefined") throw new Error("noclip");
      const p = buildImage().then((r) => { missing = r.missing; return r.blob; });
      await navigator.clipboard.write([new ClipboardItem({ "image/png": p })]);
      btn.textContent = t("imgCopied");
    } else {
      const r = await buildImage();
      missing = r.missing;
      download(r.blob, fileName("png"));
      btn.textContent = t("imgDownloaded");
    }
    if (missing) status.textContent = t("artMissing", missing);
  } catch (err) {
    status.classList.add("error");
    status.textContent = err.message === "noclip" ? t("noClipboard") : t("imgError");
    btn.textContent = old;
  } finally {
    btn.disabled = false;
    setTimeout(() => (btn.textContent = old), 2000);
  }
}

/* ---------- Exportar PDF ---------- */
let jsPdfPromise = null;
function loadJsPDF() {
  if (window.jspdf) return Promise.resolve(window.jspdf.jsPDF);
  if (!jsPdfPromise) {
    jsPdfPromise = new Promise((res, rej) => {
      const sc = document.createElement("script");
      sc.src = "https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js";
      sc.onload = () => res(window.jspdf.jsPDF);
      sc.onerror = () => { jsPdfPromise = null; rej(new Error("jspdf")); };
      document.head.appendChild(sc);
    });
  }
  return jsPdfPromise;
}
async function toJpeg(src) {
  const im = await loadImg(src);
  if (!im) return null;
  const cv = document.createElement("canvas");
  cv.width = im.naturalWidth || im.width; cv.height = im.naturalHeight || im.height;
  const ctx = cv.getContext("2d");
  ctx.fillStyle = "#ffffff"; ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.drawImage(im, 0, 0, cv.width, cv.height);
  try { return cv.toDataURL("image/jpeg", 0.9); } catch (_) { return null; }
}
// Só caracteres que as fontes padrão do PDF conhecem
const pdfSafe = (s) => s.replace(/…/g, "...").replace(/[‘’]/g, "'").replace(/[“”]/g, '"').replace(/[^\x00-\xFF]/g, "?");

const PDF_THEMES = {
  dark: { bg: [18, 21, 27], panel: [26, 30, 38], line: [44, 50, 61], ink: [231, 233, 238], muted: [154, 162, 177], accent: [217, 164, 65], out: [224, 113, 95], in: [92, 191, 130] },
  light: { bg: [255, 255, 255], panel: [244, 245, 247], line: [214, 218, 225], ink: [27, 31, 39], muted: [93, 101, 116], accent: [148, 101, 18], out: [179, 64, 47], in: [44, 122, 72] },
};

async function buildPdf(JsPDF) {
  const view = viewPairs();
  const pairs = view.map((v) => v.p);
  const PDF = $("pdfLight").checked ? PDF_THEMES.light : PDF_THEMES.dark;
  const doc = new JsPDF({ unit: "mm", format: "a4", orientation: "portrait", compress: true });
  const W = 210, H = 297, M = 12, HEAD = 20, FOOT = 10, PER = 3, GAP = 5;
  const blockH = (H - 2 * M - HEAD - FOOT - GAP * (PER - 1)) / PER;
  const pad = 6, cardH = blockH - 2 * pad, cardW = cardH * 488 / 680, arrowW = 13;
  const blockW = W - 2 * M;
  const infoX = M + pad + cardW * 2 + arrowW + 8, infoW = W - M - pad - infoX;
  const pages = Math.ceil(pairs.length / PER);
  const deck = pdfSafe(deckTitle());

  const entries = pairs.flatMap((p) => [p.out, p.in]);
  const jpgs = await Promise.all(entries.map((e) => (e ? toJpeg(largeOf(current.found.get(keyOf(e)))) : null)));
  const missing = entries.filter((e, k) => e && !jpgs[k]).length;
  const { total, list } = buyInfo();

  const color = (rgb, kind = "text") => (kind === "text" ? doc.setTextColor(...rgb) : kind === "fill" ? doc.setFillColor(...rgb) : doc.setDrawColor(...rgb));
  const lines = (text, width, max) => {
    const out = doc.splitTextToSize(text, width);
    if (out.length <= max) return out;
    const cut = out.slice(0, max);
    let last = cut[max - 1];
    while (last && doc.getTextWidth(last + "...") > width) last = last.slice(0, -1);
    cut[max - 1] = last + "...";
    return cut;
  };

  function drawSlot(x, y, entry, jpg, side) {
    if (!entry) {
      color(PDF.line, "draw"); doc.setLineWidth(0.4); doc.setLineDashPattern([2, 1.6], 0);
      doc.roundedRect(x, y, cardW, cardH, 2.5, 2.5, "S");
      doc.setLineDashPattern([], 0);
      doc.setFont("helvetica", "normal"); doc.setFontSize(9); color(PDF.muted);
      doc.text(pdfSafe(side === "out" ? t("slotOut") : t("slotIn")), x + cardW / 2, y + cardH / 2, { align: "center", baseline: "middle" });
      return;
    }
    // contorno colorido fora da carta (a arte não é alterada)
    color(side === "out" ? PDF.out : PDF.in, "draw"); doc.setLineWidth(0.8);
    doc.roundedRect(x - 1.3, y - 1.3, cardW + 2.6, cardH + 2.6, 3.4, 3.4, "S");
    if (jpg) {
      doc.addImage(jpg, "JPEG", x, y, cardW, cardH, undefined, "FAST");
    } else {
      color(PDF.line, "fill"); doc.roundedRect(x, y, cardW, cardH, 2.5, 2.5, "F");
      doc.setFont("helvetica", "bold"); doc.setFontSize(11); color(PDF.ink);
      doc.text(lines(pdfSafe(nameOf(entry)), cardW - 8, 4), x + cardW / 2, y + cardH / 2 - 6, { align: "center" });
    }
  }
  function drawArrow(cx, cy) {
    color(PDF.accent, "draw"); doc.setLineWidth(0.9); doc.setLineCap("round"); doc.setLineJoin("round");
    doc.line(cx - 4, cy, cx + 3.6, cy);
    doc.line(cx + 0.8, cy - 2.8, cx + 3.6, cy); doc.line(cx + 0.8, cy + 2.8, cx + 3.6, cy);
  }
  function drawInfo(x, y, i, p) {
    let ty = y + 3;
    doc.setFont("courier", "normal"); doc.setFontSize(9); color(PDF.muted);
    doc.text(pdfSafe(t("swapNo", String(i + 1).padStart(2, "0"))), x, ty);
    ty += 8;
    doc.setFont("helvetica", "bold"); doc.setFontSize(7.5); color(PDF.out);
    doc.text(t("pdfOut"), x, ty, { charSpace: 0.6 }); ty += 4.6;
    doc.setFont("helvetica", "normal"); doc.setFontSize(11); color(PDF.muted);
    if (p.out) {
      lines((p.out.qty > 1 ? p.out.qty + "x " : "") + pdfSafe(nameOf(p.out)), infoW, 2).forEach((l) => {
        doc.text(l, x, ty);
        color(PDF.out, "draw"); doc.setLineWidth(0.35); doc.line(x, ty - 1.3, x + doc.getTextWidth(l), ty - 1.3);
        ty += 5;
      });
    } else { doc.text("-", x, ty); ty += 5; }
    ty += 4;
    doc.setFont("helvetica", "bold"); doc.setFontSize(7.5); color(PDF.in);
    doc.text(t("pdfIn"), x, ty, { charSpace: 0.6 }); ty += 4.8;
    if (p.in) {
      const c = current.found.get(keyOf(p.in));
      const name = nameOf(p.in);
      doc.setFont("helvetica", "bold"); doc.setFontSize(12); color(PDF.ink);
      lines((p.in.qty > 1 ? p.in.qty + "x " : "") + pdfSafe(name), infoW, 2).forEach((l) => { doc.text(l, x, ty); ty += 5.4; });
      ty += 1.5;
      const pr = priceOf(c), own = isOwned(p.in);
      doc.setFont("helvetica", "bold"); doc.setFontSize(11);
      color(own ? PDF.muted : PDF.accent);
      doc.text(pdfSafe(own ? t("owned") : (pr != null ? usd(pr * p.in.qty) : t("noPrice"))), x, ty);
      const url = buyUrl(c, name);
      if (url) {
        ty += 6;
        doc.setFont("helvetica", "normal"); doc.setFontSize(9); color(PDF.accent);
        const label = t("pdfLinkLabel");
        doc.textWithLink(label, x, ty, { url });
        color(PDF.accent, "draw"); doc.setLineWidth(0.2); doc.line(x, ty + 0.8, x + doc.getTextWidth(label), ty + 0.8);
      }
    } else {
      doc.setFont("helvetica", "normal"); doc.setFontSize(11); color(PDF.muted);
      doc.text("-", x, ty);
    }
  }

  const today = new Date().toLocaleDateString(t("locale"));
  for (let pg = 0; pg < pages; pg++) {
    if (pg) doc.addPage();
    color(PDF.bg, "fill"); doc.rect(0, 0, W, H, "F");
    doc.setFont("helvetica", "bold"); doc.setFontSize(7.5); color(PDF.accent);
    doc.text(t("headLabel"), M, M + 3, { charSpace: 0.8 });
    doc.setFontSize(17); color(PDF.ink);
    doc.text(lines(deck, blockW - 30, 1)[0], M, M + 11);
    doc.setFont("helvetica", "normal"); doc.setFontSize(9); color(PDF.muted);
    doc.text(pdfSafe(t("page", pg + 1, pages)), W - M, M + 11, { align: "right" });
    color(PDF.line, "draw"); doc.setLineWidth(0.3); doc.line(M, M + HEAD - 5, W - M, M + HEAD - 5);

    pairs.slice(pg * PER, pg * PER + PER).forEach((p, k) => {
      const i = pg * PER + k;
      const bx = M, by = M + HEAD + k * (blockH + GAP);
      color(PDF.panel, "fill"); doc.roundedRect(bx, by, blockW, blockH, 3, 3, "F");
      const cy = by + pad;
      drawSlot(bx + pad, cy, p.out, jpgs[i * 2], "out");
      drawArrow(bx + pad + cardW + arrowW / 2, cy + cardH / 2);
      drawSlot(bx + pad + cardW + arrowW, cy, p.in, jpgs[i * 2 + 1], "in");
      drawInfo(infoX, cy, view[i].idx, p);
    });

    const fy = H - M;
    doc.setFont("helvetica", "bold"); doc.setFontSize(9.5); color(PDF.ink);
    doc.text(pdfSafe(t("footBuy", list.length, usd(total))), M, fy);
    doc.setFont("helvetica", "normal"); doc.setFontSize(8); color(PDF.muted);
    doc.text(pdfSafe(t("credit", today)), W - M, fy, { align: "right" });
  }
  return { blob: doc.output("blob"), missing };
}

async function exportPdf(btn) {
  if (!current.pairs.length) return;
  const old = btn.textContent, status = $("status");
  btn.disabled = true; btn.textContent = t("pdfGenerating");
  status.classList.remove("error"); status.textContent = "";
  try {
    const JsPDF = await loadJsPDF();
    const { blob, missing } = await buildPdf(JsPDF);
    download(blob, fileName("pdf"));
    btn.textContent = t("pdfDownloaded");
    status.textContent = missing ? `${t("pdfReady")} ${t("artMissing", missing)}` : t("pdfReady");
  } catch (err) {
    status.classList.add("error");
    status.textContent = err.message === "jspdf" ? t("pdfLibError") : t("pdfError");
    btn.textContent = old;
  } finally {
    btn.disabled = false;
    setTimeout(() => (btn.textContent = old), 2000);
  }
}

/* ---------- Ações ---------- */
async function run() {
  const { pairs, bad } = parseSwaps($("swapList").value);
  const status = $("status");
  status.classList.remove("error");
  if (!pairs.length) {
    status.classList.add("error");
    status.textContent = bad.length ? t("noArrow", bad[0]) : t("noInput");
    return;
  }
  const entries = pairs.flatMap((p) => [p.out, p.in]).filter(Boolean);
  $("go").disabled = true;
  status.textContent = t("searching", entries.length);
  try {
    const inKeys = new Set(pairs.filter((p) => p.in).map((p) => keyOf(p.in)));
    const found = await lookup(entries, inKeys, (n, total) => { status.textContent = t("pricing", n, total); });
    current = { pairs, found };
    render();
    if (bad.length) { status.classList.add("error"); status.textContent = t("badLines", bad); }
    else status.textContent = t("done");
    saveHash();
  } catch (err) {
    status.classList.add("error");
    status.textContent = err instanceof TypeError ? t("fetchBlocked") : (err.message || t("genericFetch"));
  } finally {
    $("go").disabled = false;
  }
}

function encode(obj) { return btoa(unescape(encodeURIComponent(JSON.stringify(obj)))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, ""); }
function decode(s) { return JSON.parse(decodeURIComponent(escape(atob(s.replace(/-/g, "+").replace(/_/g, "/"))))); }
function saveHash() { history.replaceState(null, "", "#d=" + encode({ t: $("swapList").value, n: $("deckName").value })); }

async function copy(text, btn, done) {
  const old = btn.textContent;
  try { await navigator.clipboard.writeText(text); btn.textContent = done; }
  catch (_) { btn.textContent = t("copyManual"); }
  setTimeout(() => (btn.textContent = old), 1800);
}

$("go").addEventListener("click", run);
$("share").addEventListener("click", (ev) => { saveHash(); copy(location.href, ev.currentTarget, t("linkCopied")); });
$("copyBuy").addEventListener("click", (ev) => copy($("buyText").textContent, ev.currentTarget, t("listCopied")));
$("downloadPdf").addEventListener("click", (ev) => exportPdf(ev.currentTarget));
$("downloadImg").addEventListener("click", (ev) => exportImage("download", ev.currentTarget));
$("copyImg").addEventListener("click", (ev) => exportImage("copy", ev.currentTarget));
$("deckName").addEventListener("change", () => { if (current.pairs.length) saveHash(); });
document.querySelectorAll("[data-lang]").forEach((b) => b.addEventListener("click", () => setLang(b.dataset.lang)));
document.querySelectorAll("[data-size]").forEach((b) => b.addEventListener("click", () => setSize(b.dataset.size)));
$("sortBy").addEventListener("change", (ev) => setSort(ev.target.value));
document.addEventListener("keydown", (ev) => { if ((ev.ctrlKey || ev.metaKey) && ev.key === "Enter") run(); });

(function init() {
  applyLang();
  setSize(store.get(SIZE_KEY, "m"));
  $("sortBy").value = sortBy;
  let text = EXAMPLE;
  const m = location.hash.match(/d=([A-Za-z0-9_-]+)/);
  if (m) {
    try {
      const d = decode(m[1]);
      if (typeof d.t === "string") text = d.t;
      else if (d.o || d.i) { // links da primeira versão, com duas listas
        const o = (d.o || "").split(/\r?\n/).filter((l) => l.trim());
        const i = (d.i || "").split(/\r?\n/).filter((l) => l.trim());
        text = Array.from({ length: Math.max(o.length, i.length) }, (_, k) => `${o[k] || ""} --> ${i[k] || ""}`.trim()).join("\n");
      }
      if (typeof d.n === "string") $("deckName").value = d.n;
    } catch (_) { /* usa o exemplo */ }
  }
  $("swapList").value = text;
  run();
})();
